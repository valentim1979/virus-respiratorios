project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!sivep_15rs/"
    - "!arquivo/"
    - "!vigilancia-sentinela/"
  resources:
    - "dados/**"

website:
  title: "15ª RS — Vigilância Epidemiológica"
  description: "Boletim epidemiológico da 15ª Regional de Saúde de Maringá/PR"
  navbar:
    background: "#003366"
    left:
      - href: index.qmd
        text: "Vigilância Universal — SRAG"
      - href: descritiva.qmd
        text: "Estatística Descritiva"
      - href: sobre.qmd
        text: "Sobre"
  page-footer:
    left: "15ª Regional de Saúde — Seção de Vigilância Epidemiológica — Maringá/PR"
    right:
      - text: "Fonte: SIVEP-Gripe"

execute:
  echo: false
  warning: false
  message: false
  freeze: auto

format:
  html:
    theme:
      light: [cosmo, assets/custom.scss]
    lang: pt
    toc: true
    toc-title: "Nesta página"
    toc-depth: 2
    lightbox: true
    fig-align: center
    fig-cap-location: bottom
    code-fold: true